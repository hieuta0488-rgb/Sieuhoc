<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siêu Học</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --nen:#f1f4fa; --the:#ffffff; --chu:#1d2433; --mo:#667085; --vien:#e2e7f0;
  --xanh:#2f62e8; --xanh2:#5b4ce6; --nhat:#e9efff; --luc:#12a06a; --nhatluc:#e5f7ee;
  --do:#e0424a; --nhatdo:#fdecec; --vang:#f2a514; --nhatvang:#fff4dc;
  --bong:0 4px 18px rgba(25,40,80,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --nen:#0e131d; --the:#171e2c; --chu:#e6ebf4; --mo:#97a3b6; --vien:#273249;
  --xanh:#5f86f6; --xanh2:#7a6cf2; --nhat:#1c2741; --luc:#2bbd83; --nhatluc:#12301f;
  --do:#f06a70; --nhatdo:#3a1c1e; --vang:#f2b544; --nhatvang:#3a2e12; --bong:0 4px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --nen:#0e131d; --the:#171e2c; --chu:#e6ebf4; --mo:#97a3b6; --vien:#273249;
  --xanh:#5f86f6; --xanh2:#7a6cf2; --nhat:#1c2741; --luc:#2bbd83; --nhatluc:#12301f;
  --do:#f06a70; --nhatdo:#3a1c1e; --vang:#f2b544; --nhatvang:#3a2e12; --bong:0 4px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito','Segoe UI',Roboto,system-ui,Arial,sans-serif;background:var(--nen);color:var(--chu);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:230px;flex:0 0 230px;background:var(--the);border-right:1px solid var(--vien);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo .o{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--xanh),var(--xanh2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.logo b{display:block;font-size:15px}.logo small{color:var(--mo);font-size:12px}
.nav button{display:flex;gap:10px;align-items:center;width:100%;border:none;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;color:var(--mo)}
.nav button:hover{background:var(--nen)}
.nav button.chon{background:var(--nhat);color:var(--xanh)}
.nav .badge{margin-left:auto;background:var(--do);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.side .phu{border-top:1px solid var(--vien);margin-top:12px;padding-top:12px}
main{flex:1;min-width:0;padding:22px max(16px,3vw) 60px}
.wrapc{max-width:1000px;margin:0 auto}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--mo);margin:0 0 16px}
.card{background:var(--the);border:1px solid var(--vien);border-radius:20px;box-shadow:var(--bong);padding:18px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.side{display:none}.mnav{display:flex!important}.g2{grid-template-columns:1fr}}
.mnav{display:none;position:sticky;top:0;z-index:20;background:var(--the);border-bottom:1px solid var(--vien);overflow-x:auto;padding:6px}
.mnav button{border:none;background:none;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--mo);white-space:nowrap}
.mnav button.chon{background:var(--nhat);color:var(--xanh)}
.stat{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:14px}
.stat .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{color:var(--mo);font-size:12.5px;font-weight:600}
.btn{border:none;border-radius:14px;padding:11px 18px;cursor:pointer;font-weight:800;background:var(--xanh);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:hover{filter:brightness(1.07)}
.btn.phu{background:var(--nen);color:var(--chu);border:1px solid var(--vien)}
.btn.luc{background:var(--luc)}.btn.do{background:var(--do)}.btn.vang{background:var(--vang);color:#3d2a00}
.btn.nho{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--vien);background:var(--the);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.chip.chon{background:var(--xanh);border-color:var(--xanh);color:#fff}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--nhat);color:var(--xanh)}
.pill.luc{background:var(--nhatluc);color:var(--luc)}.pill.vang{background:var(--nhatvang);color:#a86d00}.pill.do{background:var(--nhatdo);color:var(--do)}
.bar{height:10px;background:var(--nen);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--luc),#3fd09a)}
input[type=text],select{padding:10px 12px;border-radius:11px;border:1px solid var(--vien);background:var(--the);color:var(--chu);font-size:15px}
input[type=text]:focus,select:focus{outline:2px solid var(--xanh);border-color:transparent}
.fc{max-width:560px;margin:0 auto;text-align:center}
.fc .big{font-size:42px;font-weight:800;letter-spacing:.3px;word-break:break-word}
.fc .ipa{color:var(--xanh);font-size:18px}
.fc .vi{font-size:26px;font-weight:800;color:var(--luc);margin-top:10px}
.fc .ex{background:var(--nen);border-radius:12px;padding:12px;margin-top:14px;text-align:left}
.fc .ex i{color:var(--mo)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:2px solid var(--vien);background:var(--the);border-radius:16px;padding:14px 16px;font-size:16px;text-align:left;cursor:pointer;font-weight:600}
.opt:hover{border-color:var(--xanh)}
.opt.dung{border-color:var(--luc);background:var(--nhatluc)}
.opt.sai{border-color:var(--do);background:var(--nhatdo)}
.opt:disabled{cursor:default}
.why{margin-top:12px;background:var(--nhatvang);border-radius:12px;padding:12px 14px}
.passage{background:var(--nen);border-radius:12px;padding:14px;white-space:pre-wrap;margin-bottom:10px}
.passage .lab{display:block;font-weight:800;color:var(--xanh);margin-bottom:6px;white-space:normal}
.lesson h4{margin:16px 0 6px;color:var(--xanh)}
.lesson table{border-collapse:collapse;width:100%;margin:8px 0}
.lesson td,.lesson th{border:1px solid var(--vien);padding:7px 9px;text-align:left;vertical-align:top}
.lesson .meo{background:var(--nhatvang);border-radius:12px;padding:10px 14px;margin:12px 0}
.tbl{overflow-x:auto}
.list .it{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--vien)}
.list .it:last-child{border-bottom:none}
.list .it .w{font-weight:700}
.list .it .m{color:var(--mo);font-size:13.5px}
.list .it .grow{flex:1;min-width:0}
.loa{border:none;background:var(--nhatvang);color:#8a5a00;width:38px;height:38px;border-radius:10px;cursor:pointer;flex:0 0 auto;font-size:17px}
.step{display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--vien);margin-bottom:8px;align-items:center}
.step .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--nhat);color:var(--xanh);font-weight:800;flex:0 0 auto}
.step.xong .k{background:var(--luc);color:#fff}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.score{font-size:52px;font-weight:800;color:var(--xanh);font-variant-numeric:tabular-nums}
.dialog .ln{margin:4px 0}.dialog .ln b{color:var(--xanh)}
.mut{color:var(--mo)}
.center{text-align:center}
.mt{margin-top:12px}
button:focus-visible{outline:3px solid var(--xanh);outline-offset:2px}

.hero{background:linear-gradient(135deg,var(--xanh),var(--xanh2));color:#fff;border-radius:24px;padding:22px 24px;display:flex;gap:18px;align-items:center;margin-bottom:14px;box-shadow:0 10px 30px rgba(60,80,200,.25)}
.hero .mas{font-size:64px;line-height:1}
.hero h2{color:#fff;font-size:24px}.hero p{margin:4px 0 0;opacity:.95}
.star{display:inline-flex;align-items:center;gap:6px;background:var(--nhatvang);color:#8a5a00;border-radius:999px;padding:4px 12px;font-weight:900}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.topic{background:var(--the);border:2px solid var(--vien);border-radius:20px;padding:14px;cursor:pointer;text-align:left;transition:transform .12s,border-color .12s}
.topic:hover{transform:translateY(-3px);border-color:var(--xanh)}
.topic .e{font-size:34px}.topic b{display:block;margin-top:6px;font-size:14px;line-height:1.3}.topic small{color:var(--mo)}
.fc .pic{font-size:72px;line-height:1;margin:4px 0 6px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--mo);font-weight:700;margin-bottom:12px}
.crumb a{color:var(--xanh);cursor:pointer;text-decoration:none}
.tabs2{display:flex;gap:8px;margin:4px 0 14px}.tabs2 button{flex:1;border:2px solid var(--vien);background:var(--the);border-radius:16px;padding:12px;font-weight:800;cursor:pointer;font-size:15px}
.tabs2 button.chon{border-color:var(--xanh);background:var(--nhat);color:var(--xanh)}
.lvcard{border-radius:20px;padding:16px;border:2px solid transparent;cursor:pointer;text-align:left}
.lvcard:hover{transform:translateY(-3px)}.lvcard .e{font-size:30px}.lvcard b{font-size:17px;display:block;margin-top:4px}
.giai{background:var(--the);border:2px solid var(--vien);border-radius:16px;padding:14px 16px;margin-top:12px}
.giai h4{margin:0 0 6px;color:var(--xanh)}
.meo2{background:var(--nhatvang);border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:600}
.ans{background:var(--nhatluc);border-radius:12px;padding:10px 14px;margin-top:10px}
textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--vien);background:var(--the);color:var(--chu);padding:10px;font:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="o">SH</div><div><b>Siêu Học</b><small>Lớp 1 → 12 · TOEIC</small></div></div>
    <div style="padding:0 8px 12px"><span class="star">⭐ <span id="xp">0</span> sao</span></div><nav class="nav" id="nav"></nav>
    <div class="phu nav">
      <button onclick="doiMau()">🌓 Đổi màu sáng/tối</button>
    </div>
  </aside>
  <main>
    <div class="mnav" id="mnav"></div>
    <div class="wrapc" id="view"></div>
  </main>
</div>

<script>
/*__DATA__*/
</script>
<script>
/* ===================== DỮ LIỆU ===================== */
const SCHOOL=DATA.school||[];
const BANK=DATA.bank||[];
const LVS=[{k:'Cơ bản',c:'#12a06a',bg:'var(--nhatluc)',e:'🟢',d:'Nắm chắc kiến thức trên lớp'},{k:'Nâng cao',c:'#c98a00',bg:'var(--nhatvang)',e:'🟡',d:'Học sinh khá giỏi · ôn thi chuyển cấp'},{k:'Olympic/IOE',c:'#e06a14',bg:'#fff0e3',e:'🟠',d:'Thi Olympic, IOE tiểu học'},{k:'HSG cấp tỉnh',c:'#e06a14',bg:'#fff0e3',e:'🟠',d:'Đội tuyển học sinh giỏi tỉnh/thành'},{k:'HSG quốc gia',c:'#e0424a',bg:'var(--nhatdo)',e:'🔴',d:'Đội tuyển quốc gia'}];
const SUBJECTS_ALL=[
 {id:'toan',icon:'➗',g:[1,12],name:g=>'Toán'},
 {id:'van',icon:'📖',g:[1,12],name:g=>g<=5?'Tiếng Việt':'Ngữ văn'},
 {id:'en',icon:'🇬🇧',g:[1,12],name:g=>'Tiếng Anh'},
 {id:'khtn',icon:'🔬',g:[1,9],name:g=>g<=3?'Tự nhiên và Xã hội':g<=5?'Khoa học':'Khoa học tự nhiên'},
 {id:'ly',icon:'⚛️',g:[10,12],name:g=>'Vật lí'},
 {id:'hoa',icon:'⚗️',g:[10,12],name:g=>'Hoá học'},
 {id:'sinh',icon:'🧬',g:[10,12],name:g=>'Sinh học'},
 {id:'ls',icon:'🌏',g:[4,12],name:g=>g<=9?'Lịch sử và Địa lí':'Lịch sử'},
 {id:'dia',icon:'🗺️',g:[10,12],name:g=>'Địa lí'},
 {id:'tin',icon:'💻',g:[3,12],name:g=>'Tin học'}];
let SUBJECTS=SUBJECTS_ALL.map(x=>({id:x.id,icon:x.icon,name:x.name(6)}));
function subjFor(g){ return SUBJECTS_ALL.filter(x=>g>=x.g[0]&&g<=x.g[1]).map(x=>({id:x.id,icon:x.icon,name:x.name(g)})); }
const W = (DATA.words||[]).map((x,i)=>Object.assign({id:i, en:x.w.replace(/\s+\d+$/,'')},x));
const GR = DATA.grammar||[], P5=DATA.part5||[], P6=DATA.part6||[], P7=DATA.part7||[], LS=DATA.listening||{p1:[],p2:[],p3:[],p4:[]};
const TOPICS = [...new Set(W.map(w=>w.t))];
const LEVELS = ['A1','A2','B1','B2','C1'];
const LVNAME={A1:'A1 · Khởi đầu',A2:'A2 · Sơ cấp',B1:'B1 · Trung cấp',B2:'B2 · Trung cao',C1:'C1 · Nâng cao'};
const TICON={"Con người & Gia đình":"👨‍👩‍👧","Cơ thể & Sức khỏe":"🩺","Nhà cửa & Đồ dùng":"🏠","Ăn uống":"🍜","Quần áo & Mua sắm":"🛍️","Công việc & Văn phòng":"💼","Kinh doanh & Tiền bạc":"💰","Học tập & Giáo dục":"🎒","Thời gian & Số lượng":"⏰","Thiên nhiên & Thời tiết":"🌦️","Động vật & Cây cối":"🐾","Du lịch & Giao thông":"✈️","Thành phố & Địa điểm":"🏙️","Cảm xúc & Tính cách":"😊","Giao tiếp & Ngôn ngữ":"💬","Khoa học & Công nghệ":"🔬","Xã hội & Pháp luật":"⚖️","Nghệ thuật & Giải trí":"🎨","Thể thao & Sở thích":"⚽","Từ chức năng (ngữ pháp)":"🧩","Động từ thông dụng":"🏃","Tính từ & Trạng từ thông dụng":"🌈"};
function ticon(t){ return TICON[t] || (/^TOEIC/.test(t)?'⭐':'📘'); }
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let c=document.getElementById('confetti'); if(!c){c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);}
  const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#2f62e8','#5b4ce6','#12a06a','#f2a514','#e0424a','#24b5d6'];
  const ps=Array.from({length:70},()=>({x:innerWidth/2,y:innerHeight/2.4,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,s:5+Math.random()*6,c:cols[Math.random()*cols.length|0],r:Math.random()*6}));
  let f=0; (function tick(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();}); if(++f<70) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height); })();
}
function addStar(n){ S.xp=(S.xp||0)+n; save(); const e=document.getElementById('xp'); if(e){e.textContent=S.xp; e.parentNode.classList.remove('pop'); void e.offsetWidth; e.parentNode.classList.add('pop');} }

/* ===================== LƯU TRỮ ===================== */
const KEY='sieutoeic_v1';
let S = {srs:{}, newPerDay:20, done:{}, gr:{}, parts:{}, tests:[], streak:{d:'',n:0}, target:650, today:{d:'',learned:0,reviewed:0}};
try{ const o=JSON.parse(localStorage.getItem(KEY)||'null'); if(o) S=Object.assign(S,o); }catch(e){}
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} try{ if(window.__server) fetch('/api/tien_do',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tien_do:S})}); }catch(e){} },400); }
const DAY=86400000;
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function touchDay(){
  const t=todayStr();
  if(S.today.d!==t) S.today={d:t,learned:0,reviewed:0};
  if(S.streak.d!==t){ const y=new Date(Date.now()-DAY); const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate(); S.streak.n=(S.streak.d===ys)?S.streak.n+1:1; S.streak.d=t; }
  save();
}

/* ===================== PHÁT ÂM ===================== */
let VOICES=[];
function loadV(){ try{VOICES=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));}catch(e){} }
if('speechSynthesis' in window){ loadV(); speechSynthesis.onvoiceschanged=loadV; }
function pickVoices(){
  const good=v=>/natural|online|aria|jenny|guy|michelle|davis|google/i.test(v.name);
  const us=VOICES.filter(v=>/en[-_]US/i.test(v.lang));
  const sorted=[...VOICES].sort((a,b)=>(good(b)-good(a))||((/US/.test(b.lang))-(/US/.test(a.lang))));
  const fem=sorted.find(v=>/aria|jenny|michelle|zira|female|samantha|susan|hazel/i.test(v.name))||sorted[0];
  const male=sorted.find(v=>v!==fem && /guy|davis|david|mark|male|george|daniel/i.test(v.name))||sorted.find(v=>v!==fem)||fem;
  return {fem,male,def:sorted[0]||null};
}
let RATE=0.92;
function say(text,opts={}){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)) return res();
    const u=new SpeechSynthesisUtterance(text);
    const P=pickVoices(); const v=opts.voice||P.def;
    if(v){u.voice=v;u.lang=v.lang;} else u.lang='en-US';
    u.rate=opts.rate||RATE; u.pitch=opts.pitch||1;
    u.onend=res; u.onerror=res;
    speechSynthesis.speak(u);
  });
}
function stopSay(){ try{speechSynthesis.cancel();}catch(e){} }
async function sayLines(lines){ // [{s,t}]
  stopSay(); const P=pickVoices();
  for(const l of lines){ const isW=/^W/i.test(l.s); await say(l.t,{voice:isW?P.fem:P.male,pitch:(isW?1.1:0.9)}); }
}
function sp(t){ stopSay(); say(t); }

/* ===================== SRS (ôn tập ngắt quãng) ===================== */
const INTERVALS=[0, 1, 3, 7, 14, 30, 60, 120]; // ngày
function due(){ const now=Date.now(); return Object.entries(S.srs).filter(([id,c])=>c.due<=now).map(([id])=>W[+id]).filter(Boolean); }
function grade(w,ok){
  const c=S.srs[w.id]||{box:0,due:0,seen:0};
  c.box = ok? Math.min(c.box+1, INTERVALS.length-1) : 1;
  c.due = Date.now() + (ok? INTERVALS[c.box]*DAY : 10*60*1000);
  c.seen++;
  S.srs[w.id]=c; save();
}
function knownCount(){ return Object.values(S.srs).filter(c=>c.box>=3).length; }
function learnedCount(){ return Object.keys(S.srs).length; }

/* ===================== ĐIỀU HƯỚNG ===================== */
const PAGES=[
 ['home','🏠','Trang chủ'],['school','🏫','Học theo lớp'],['road','🗺️','Lộ trình'],['learn','🆕','Học từ mới'],['review','🔁','Ôn tập'],
 ['vocab','📚','Kho từ vựng'],['grammar','📘','Ngữ pháp'],['listen','🎧','Luyện Nghe (P1-4)'],

function go(p,arg){ stopSay(); clearInterval(window.__tm); cur=p; nav(); window.scrollTo(0,0); (VIEWS[p]||VIEWS.home)(arg); }
const V=()=>document.getElementById('view');
function rich(s){return esc(s).replace(/&lt;(\/?)(b|i|u|br|strong|em|sup|sub)\s*\/?&gt;/g,'<$1$2>');}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}

/* ===================== ƯỚC TÍNH ĐIỂM ===================== */
function partAcc(k){ const p=S.parts[k]; return p&&p.t? p.c/p.t : null; }
function estScore(){
  const last=S.tests[S.tests.length-1]; if(last) return last.total;
  const lk=['p1','p2','p3','p4'].map(partAcc).filter(x=>x!==null), rk=['p5','p6','p7'].map(partAcc).filter(x=>x!==null);
  if(!lk.length&&!rk.length) return null;
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0.25;
  return convL(Math.round(avg(lk)*100))+convR(Math.round(avg(rk)*100));
}
// bảng quy đổi xấp xỉ (số câu đúng/100 -> điểm 5..495)
function convL(c){ return Math.max(5,Math.min(495, Math.round((c<=5?5: c>=96?495: 5+ (c-5)*(490/91)) /5)*5)); }
function convR(c){ return Math.max(5,Math.min(495, Math.round((c<=7?5: c>=98?495: 5+ (c-7)*(490/91)) /5)*5)); }

/* ===================== HỌC TỪ MỚI ===================== */
let LQ=[], LI=0, LFILTER=null;
VIEWS.learn=(f)=>{
  touchDay(); if(f) LFILTER=f;
  const pool=W.filter(w=>!S.srs[w.id] && (!LFILTER || ((!LFILTER.lv||w.lv===LFILTER.lv)&&(!LFILTER.t||w.t===LFILTER.t)&&(!LFILTER.toeic||w.toeic))));
  // ưu tiên cấp thấp trước
  pool.sort((a,b)=>LEVELS.indexOf(a.lv)-LEVELS.indexOf(b.lv) || (b.toeic-a.toeic));
  const n=Math.max(1, S.newPerDay - S.today.learned);
  LQ=pool.slice(0, S.today.learned>=S.newPerDay? 10 : n); LI=0;
  if(!LQ.length){ V().innerHTML=`<div class="card center"><h2>🎉 Hết từ mới trong mục này</h2><p class="sub">Chọn chủ đề khác trong Kho từ vựng.</p><button class="btn" onclick="LFILTER=null;go('learn')">Học tất cả</button></div>`; return; }
  showLearn();
};
function showLearn(){
  const w=LQ[LI]; if(!w){ V().innerHTML=`<div class="card center"><h2>✅ Xong phần học từ mới!</h2><p class="sub">Các từ này sẽ được nhắc ôn đúng lúc. Làm bài kiểm tra nhanh nhé.</p><button class="btn" onclick="go('review')">Ôn tập ngay</button> <button class="btn phu" onclick="go('learn')">Học thêm</button></div>`; return; }
  V().innerHTML=`<p class="sub">Từ mới ${LI+1}/${LQ.length} ${LFILTER?'· '+esc(LFILTER.t||LFILTER.lv||'TOEIC'):''}</p>
  <div class="card fc">
    <div class="row" style="justify-content:center"><span class="pill">${w.lv}</span><span class="pill vang">${esc(w.pos)}</span>${w.toeic?'<span class="pill luc">TOEIC</span>':''}<span class="pill">${esc(w.t)}</span></div>
    <div class="pic">${ticon(w.t)}</div>
    <div class="big">${esc(w.en)}</div>
    <div class="ipa">${esc(w.ipa||'')}</div>
    <div class="row mt" style="justify-content:center"><button class="btn vang" onclick="sp(W[${w.id}].en)">🔊 Nghe</button><button class="btn phu" onclick="say(W[${w.id}].en,{rate:0.6})">🐢 Đọc chậm</button></div>
    <div class="vi">${esc(w.vi)}</div>
    <div class="ex"><div>${esc(w.ex)} <button class="loa" style="width:30px;height:30px;font-size:14px" onclick="sp(W[${w.id}].ex)">🔊</button></div><i>${esc(w.exvi)}</i></div>

      <button class="btn phu" onclick="LI=Math.max(0,LI-1);showLearn()">◀ Trước</button>
      <button class="btn luc" onclick="learnNext(true)">Đã biết từ này ✓</button>
      <button class="btn" onclick="learnNext(false)">Học từ này ▶</button>
    </div>
  </div>`;

function learnNext(known){
  const w=LQ[LI];
  S.srs[w.id]={box: known?3:0, due: Date.now()+(known?7*DAY:5*60*1000), seen:1};
  S.today.learned++; addStar(1); save(); LI++; if(LI===LQ.length) confetti(); showLearn();
}

let RQ=[],RI=0,RC=0;
VIEWS.review=()=>{
  touchDay();
  RQ=shuffle(due()).slice(0,40); RI=0; RC=0;
  if(!RQ.length){ const nx=Object.values(S.srs).map(c=>c.due).sort((a,b)=>a-b)[0];
    V().innerHTML=`<div class="card center"><h2>👏 Không còn từ nào cần ôn</h2><p class="sub">${nx?'Lượt ôn tiếp theo: '+new Date(nx).toLocaleString('vi-VN'):'Hãy học vài từ mới trước.'}</p><button class="btn" onclick="go('learn')">Học từ mới</button></div>`; return; }
  showReview();
};
function distract(w,field){ return pick(W.filter(x=>x.id!==w.id && x.pos===w.pos && x[field]!==w[field]),3).map(x=>x[field]); }
function showReview(){
  const w=RQ[RI];
  if(!w){ V().innerHTML=`<div class="card center"><h2>Hoàn thành lượt ôn!</h2><div class="score">${RC}/${RQ.length}</div><p class="sub">Từ sai sẽ được hỏi lại sau 10 phút.</p><button class="btn" onclick="go('review')">Ôn tiếp</button> <button class="btn phu" onclick="go('home')">Về trang chủ</button></div>`; return; }
  const mode=['ev','ve','listen','spell'][Math.floor(Math.random()*4)];
  let head='', body='';
  if(mode==='spell'){
    head=`<div class="mut">Nghe và gõ lại từ (nghĩa: <b>${esc(w.vi)}</b>)</div><button class="btn vang mt" onclick="sp(W[${w.id}].en)">🔊 Nghe</button>`;
    body=`<div class="row mt" style="justify-content:center"><input type="text" id="spIn" autocomplete="off" placeholder="Gõ từ tiếng Anh..." onkeydown="if(event.key==='Enter')checkSpell(${w.id})"><button class="btn" onclick="checkSpell(${w.id})">Kiểm tra</button></div><div id="fb"></div>`;
    setTimeout(()=>{sp(w.en);document.getElementById('spIn')?.focus();},200);
  } else {
    const field= mode==='ve'?'en':'vi';
    const opts=shuffle([w[field],...distract(w,field)]);
    head= mode==='ev'? `<div class="big">${esc(w.en)}</div><div class="ipa">${esc(w.ipa||'')}</div>` : mode==='ve'? `<div class="big" style="font-size:30px">${esc(w.vi)}</div>` : `<div class="mut">Nghe và chọn nghĩa đúng</div><button class="btn vang mt" onclick="sp(W[${w.id}].en)">🔊 Nghe lại</button>`;
    body=`<div class="opts">${opts.map(o=>`<button class="opt" onclick="ansReview(this,${w.id},${JSON.stringify(o===w[field])})">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`;
    if(mode!=='ve') setTimeout(()=>sp(w.en),200);
  }
  V().innerHTML=`<p class="sub">Ôn tập ${RI+1}/${RQ.length} · đúng ${RC}</p><div class="card fc">${head}${body}</div>`;
}
function feedback(w,ok){
  grade(w,ok); if(ok){ RC++; addStar(1); if(RC%5===0) confetti(); } S.today.reviewed++; save();
  document.getElementById('fb').innerHTML=`<div class="why">${ok?'✅ Chính xác!':'❌ Chưa đúng.'} <b>${esc(w.en)}</b> ${esc(w.ipa||'')} — ${esc(w.vi)}<br><i>${esc(w.ex)}</i><br>${esc(w.exvi)}</div><div class="mt"><button class="btn" id="nx" onclick="RI++;showReview()">Tiếp ▶</button></div>`;
  document.getElementById('nx').focus();
}
function ansReview(b,id,ok){ document.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.textContent===(W[id].vi)||x.textContent===W[id].en) x.classList.add('dung');}); if(!ok) b.classList.add('sai'); sp(W[id].en); feedback(W[id],ok); }
function checkSpell(id){ const inp=document.getElementById('spIn'); if(!inp||inp.disabled) return; const ok=inp.value.trim().toLowerCase()===W[id].en.toLowerCase(); inp.disabled=true; feedback(W[id],ok); }

  <div class="card"><h3 style="margin-top:0">✍️ Bài tập (${g.quiz.length} câu)</h3><div id="gq"></div></div>`;
  runQuiz(document.getElementById('gq'), g.quiz.map(q=>({q:q.q,opts:q.opts,a:q.a,why:q.why})), (c,t)=>{S.gr[g.id]={done:true,score:c};save();});

/* ===================== BỘ LÀM BÀI CHUNG ===================== */
function runQuiz(el, qs, onDone, opt={}){
  qs=qs.map(mixOpts); let i=0,c=0;
  function show(){
    const q=qs[i];
    if(!q){ if(c/qs.length>=0.8) confetti(); el.innerHTML=`<div class="center"><div class="score">${c}/${qs.length}</div><p class="sub">${c/qs.length>=0.8?'Rất tốt! 🎉':c/qs.length>=0.5?'Khá ổn, cố thêm nhé!':'Xem lại giải thích và làm lại nhé.'}</p></div>`; onDone&&onDone(c,qs.length); return; }
    el.innerHTML=`<p class="mut">Câu ${i+1}/${qs.length}</p>${q.pre||''}<div style="font-size:17px;font-weight:600">${q.qhtml||rich(q.q||'')}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${String.fromCharCode(65+k)}. ${rich(o)}</button>`).join('')}</div><div class="fb"></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=k===q.a; if(ok){ c++; addStar(2); }
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.k===q.a) x.classList.add('dung');}); if(!ok) b.classList.add('sai');
      opt.onAnswer&&opt.onAnswer(ok);
      el.querySelector('.fb').innerHTML=`<div class="why">${ok?'✅ Đúng!':'❌ Sai. Đáp án: <b>'+String.fromCharCode(65+q.a)+'</b>'}<br>${rich(q.why||'')}</div><div class="mt"><button class="btn">Câu tiếp ▶</button></div>`;
      el.querySelector('.fb .btn').onclick=()=>{i++;show();};
    });
    q.onShow&&q.onShow();
  }
  show();
}
// Xáo thứ tự đáp án (giữ nguyên nếu có phương án tham chiếu A/B/C/D, "tất cả", "cả hai"...)
function mixOpts(q){
  if(!q||!q.opts||q.kind==='tl'||q.__mixed) return q;
  const ref=/(^|[\s(])[A-D]([\s,.)]|$)|tất cả|cả hai|cả ba|đều đúng|đều sai|all of|none of|both|neither/i;
  if(q.opts.some(o=>ref.test(o))) return q;
  const idx=shuffle(q.opts.map((_,i)=>i));
  return Object.assign({},q,{opts:idx.map(i=>q.opts[i]),a:idx.indexOf(q.a),__mixed:1});
}
function addPart(k,ok){ const p=S.parts[k]||{c:0,t:0}; p.t++; if(ok)p.c++; S.parts[k]=p; save(); }

function buildListen(part,n){
  const qs=[];
  if(part==='p1') pick(LS.p1,n).forEach(it=>{ const txt=it.opts.map((o,k)=>'('+String.fromCharCode(65+k)+') '+o).join('. ');
    qs.push({pre:`<div class="passage">🖼️ <b>Tranh:</b> ${esc(it.scene)}</div><button class="btn vang" onclick="sp(${esc(JSON.stringify(txt))})">🔊 Nghe 4 câu mô tả</button>`,q:'Chọn câu mô tả đúng nhất bức tranh:',opts:['A','B','C','D'],a:it.a,why:it.opts.map((o,k)=>String.fromCharCode(65+k)+'. '+o).join(' | ')+' — '+it.why,onShow:()=>setTimeout(()=>sp(txt),300)}); });
  if(part==='p2') pick(LS.p2,n).forEach(it=>{ const txt=it.q+'. ... (A) '+it.opts[0]+'. (B) '+it.opts[1]+'. (C) '+it.opts[2]+'.';
    qs.push({pre:`<button class="btn vang" onclick="sp(${esc(JSON.stringify(txt))})">🔊 Nghe lại</button>`,q:'Chọn câu đáp lại phù hợp nhất:',opts:['A','B','C'],a:it.a,why:'Câu hỏi: '+it.q+' | A. '+it.opts[0]+' | B. '+it.opts[1]+' | C. '+it.opts[2]+' — '+it.why,onShow:()=>setTimeout(()=>sp(txt),300)}); });
  if(part==='p3') pick(LS.p3,n).forEach(it=>{ it.qs.forEach((q,j)=>qs.push({pre: j===0?`<button class="btn vang" onclick='sayLines(${esc(JSON.stringify(it.lines))})'>🔊 Nghe hội thoại</button> <details class="mt"><summary>Xem lời thoại & dịch</summary><div class="dialog">${it.lines.map(l=>`<div class="ln"><b>${esc(l.s)}:</b> ${esc(l.t)}</div>`).join('')}<p class="mut">${esc(it.vi||'')}</p></div></details>`:`<button class="btn vang" onclick='sayLines(${esc(JSON.stringify(it.lines))})'>🔊 Nghe lại</button>`,q:q.q,opts:q.opts,a:q.a,why:q.why,onShow: j===0?()=>setTimeout(()=>sayLines(it.lines),300):null})); });
  if(part==='p4') pick(LS.p4,n).forEach(it=>{ it.qs.forEach((q,j)=>qs.push({pre:`<button class="btn vang" onclick="sp(${esc(JSON.stringify(it.text))})">🔊 Nghe bài nói (${esc(it.type||'')})</button>`+(j===0?` <details class="mt"><summary>Xem nội dung & dịch</summary><div class="passage">${esc(it.text)}</div><p class="mut">${esc(it.vi||'')}</p></details>`:''),q:q.q,opts:q.opts,a:q.a,why:q.why,onShow: j===0?()=>setTimeout(()=>sp(it.text),300):null})); });
  return qs;
}

VIEWS.read=(part)=>{
  if(!part){
    V().innerHTML=`<h2>📖 Luyện Đọc TOEIC</h2><p class="sub">Mỗi câu đều có giải thích tiếng Việt.</p>
    <div class="grid g3">${[['p5','Part 5 · Điền câu',P5.length+' câu'],['p6','Part 6 · Điền đoạn văn',P6.length+' đoạn'],['p7','Part 7 · Đọc hiểu',P7.length+' bài']].map(([k,t,n])=>`<div class="card"><h3 style="margin-top:0">${t}</h3><p class="mut">${n} · Chính xác: ${partAcc(k)===null?'—':Math.round(partAcc(k)*100)+'%'}</p><button class="btn" onclick="go('read','${k}')">Luyện ngay</button></div>`).join('')}</div>
    <div class="card"><b>Part 5 theo dạng:</b> <div class="row mt">${['word form','grammar','vocabulary','preposition','conjunction','pronoun'].map(t=>`<button class="chip" onclick="go('read','p5:${t}')">${t}</button>`).join('')}</div></div>`;
    return;
  }
  V().innerHTML=`<button class="btn phu nho" onclick="go('read')">◀ Các phần đọc</button><div class="card mt" id="rq"></div>`;
  runQuiz(document.getElementById('rq'), buildRead(part), null, {onAnswer:ok=>addPart(part.split(':')[0],ok)});
};
function p6html(it){ return `<div class="passage"><span class="lab">${esc(it.title)}</span>${esc(it.text)}</div>`; }
function p7html(it){ return it.texts.map(t=>`<div class="passage"><span class="lab">${esc(t.label)}</span>${esc(t.body)}</div>`).join('')+`<details><summary>Xem tóm tắt tiếng Việt</summary><p class="mut">${esc(it.vi||'')}</p></details>`; }
function buildRead(part,nOverride){
  const [p,ty]=part.split(':'); const qs=[];
  if(p==='p5') pick(P5.filter(x=>!ty||x.type===ty), nOverride||15).forEach(q=>qs.push({q:q.q,opts:q.opts,a:q.a,why:q.why}));
  if(p==='p6') pick(P6, nOverride||2).forEach(it=>it.qs.forEach((q,j)=>qs.push({pre:p6html(it),q:'Chỗ trống ['+(j+1)+']'+(q.q?': '+q.q:''),opts:q.opts,a:q.a,why:q.why})));
  if(p==='p7') pick(P7, nOverride||2).forEach(it=>it.qs.forEach(q=>qs.push({pre:p7html(it),q:q.q,opts:q.opts,a:q.a,why:q.why})));
  return qs;
}

function startTest(kind){
  const cfg= kind==='full'? {p1:6,p2:15,p3:4,p4:4,p5:30,p6:3,p7:5,min:75} : {p1:3,p2:8,p3:2,p4:2,p5:15,p6:1,p7:2,min:35};
  const tag=(arr,k)=>arr.map(q=>Object.assign(q,{part:k}));
  const qs=[...tag(buildListen('p1',cfg.p1),'p1'),...tag(buildListen('p2',cfg.p2),'p2'),...tag(buildListen('p3',cfg.p3),'p3'),...tag(buildListen('p4',cfg.p4),'p4'),
            ...tag(buildRead('p5',cfg.p5),'p5'),...tag(buildRead('p6',cfg.p6),'p6'),...tag(buildRead('p7',cfg.p7),'p7')];
  const res={}; let left=cfg.min*60;
  V().innerHTML=`<div class="card row" style="position:sticky;top:0;z-index:5"><b>Thi thử ${kind==='full'?'đề dài':'đề mini'}</b><span class="mut">· ${qs.length} câu</span><span style="margin-left:auto">⏱ <span class="timer" id="tm"></span></span></div><div class="card" id="tq"></div>`;
  const tick=()=>{ const m=Math.floor(left/60),s=left%60; const e=document.getElementById('tm'); if(e) e.textContent=m+':'+String(s).padStart(2,'0'); if(left--<=0){clearInterval(window.__tm); finish();} };
  clearInterval(window.__tm); window.__tm=setInterval(tick,1000); tick();
  let idx=0;
  function finish(){
    clearInterval(window.__tm); stopSay();
    const L=['p1','p2','p3','p4'], R=['p5','p6','p7'];
    const sum=(ks,f)=>ks.reduce((s,k)=>s+((res[k]||{})[f]||0),0);
    const lPct=sum(L,'t')? Math.round(sum(L,'c')/sum(L,'t')*100):0, rPct=sum(R,'t')? Math.round(sum(R,'c')/sum(R,'t')*100):0;
    const Ls=convL(lPct), Rs=convR(rPct);
    S.tests.push({at:Date.now(),kind,L:Ls,R:Rs,total:Ls+Rs,parts:res}); save();
    const weak=Object.entries(res).filter(([k,v])=>v.t).sort((a,b)=>a[1].c/a[1].t-b[1].c/b[1].t)[0];
    document.getElementById('tq').innerHTML=`<div class="center"><p class="mut">Điểm ước tính</p><div class="score">${Ls+Rs}</div><p>Nghe <b>${Ls}</b> · Đọc <b>${Rs}</b></p></div>
    <div class="grid g4 mt">${Object.entries(res).map(([k,v])=>`<div class="stat"><div class="n">${v.c}/${v.t}</div><div class="l">${k.toUpperCase()}</div></div>`).join('')}</div>
    ${weak?`<div class="why mt">📌 Phần yếu nhất: <b>${weak[0].toUpperCase()}</b>. Hãy luyện thêm phần này trong mục ${['p1','p2','p3','p4'].includes(weak[0])?'Luyện Nghe':'Luyện Đọc'}.</div>`:''}
    <div class="mt center"><button class="btn" onclick="go('test')">Xong</button></div>`;
  }
  const el=document.getElementById('tq');
  const wrapped=qs.map(q=>Object.assign({},q));
  runQuiz(el, wrapped, ()=>finish(), {onAnswer:ok=>{ const k=wrapped[Math.min(idx,wrapped.length-1)].part; const r=res[k]||{c:0,t:0}; r.t++; if(ok)r.c++; res[k]=r; addPart(k,ok); idx++; }});
}

  ${u.phrases&&u.phrases.length?`<div class="card"><h3 style="margin-top:0">💬 Mẫu câu</h3><div class="list">${u.phrases.map(p=>`<div class="it"><button class="loa" onclick="sp(${vid(p.en)})">🔊</button><div class="grow"><div class="w">${esc(p.en)}</div><div class="m">${esc(p.vi)}</div></div></div>`).join('')}</div></div>`:''}
  ${u.grammar?`<div class="card lesson"><h3 style="margin-top:0">📘 ${esc(u.grammar.title)}</h3><div class="tbl">${u.grammar.content}</div></div>`:''}
  <div class="card"><h3 style="margin-top:0">✍️ Bài tập</h3><div id="uq"></div></div>`;
  runQuiz(document.getElementById('uq'), u.quiz, (c,t)=>{S.unit=S.unit||{}; S.unit[u.id]={c,t}; save();});
}

function startBank(g,sub,lv){
  S.bank=S.bank||{};
  const all=BANK.filter(q=>q.grade===g&&(q.subject||'en')===sub&&q.level===lv);
  const wrong=all.filter(q=>S.bank[q.id]===0), fresh=all.filter(q=>S.bank[q.id]===undefined), ok=all.filter(q=>S.bank[q.id]===1);
  const qs=[...shuffle(wrong),...shuffle(fresh),...shuffle(ok)].slice(0,10).map(mixOpts);
  const L=LVS.find(x=>x.k===lv); const su=subjFor(g).find(x=>x.id===sub)||SUBJECTS.find(x=>x.id===sub);
  let i=0,c=0;
  V().innerHTML=`<div class="crumb">🏫 <a onclick="go('school')">Lớp ${g}</a> › ${su.icon} ${su.name} › <span style="color:${L.c}">${L.e} ${lv}</span></div><div class="card" id="bq"></div>`;
  const el=document.getElementById('bq');
  const giaiHTML=(q,ok)=>`<div class="giai"><h4>${ok?'✅ Chính xác!':'📝 Lời giải chi tiết'}</h4>${q.kind==='tl'?`<div class="ans">✔️ <b>Đáp án:</b> ${esc(q.ans)}</div>`:`<div class="ans">✔️ <b>Đáp án đúng: ${String.fromCharCode(65+q.a)}. ${esc(q.opts[q.a])}</b></div>`}<div class="mt">${q.giai||''}</div>${q.meo?`<div class="meo2">💡 ${esc(q.meo)}</div>`:''}</div><div class="mt row"><button class="btn" id="bn">Câu tiếp ▶</button></div>`;
  function show(){
    const q=qs[i];
    if(!q){ if(c/qs.length>=0.8) confetti(); el.innerHTML=`<div class="center"><div class="score">${c}/${qs.length}</div><p class="sub">${c/qs.length>=0.8?'Xuất sắc! 🎉':c/qs.length>=0.5?'Khá tốt, cố lên!':'Đọc kỹ lời giải rồi làm lại nhé!'}</p><button class="btn" onclick="startBank(${g},'${sub}','${lv}')">Làm lượt mới</button> <button class="btn phu" onclick="SC.tab='bank';go('school')">Chọn cấp độ khác</button></div>`; return; }
    const head=`<div class="row"><span class="pill" style="background:${L.bg};color:${L.c}">${L.e} ${lv}</span><span class="pill">${esc(q.skill||'')}</span><span class="mut" style="margin-left:auto">Câu ${i+1}/${qs.length} · đúng ${c}</span></div>
      <div class="passage mt" style="font-size:16px;font-weight:600;background:transparent;padding:6px 0">${rich(q.q)}</div>`;
    if(q.kind==='tl'){
      el.innerHTML=head+`<textarea id="tlIn" placeholder="Viết câu trả lời của em..."></textarea><div class="row mt"><button class="btn" id="xem">👀 Xem lời giải</button></div><div id="gz"></div>`;
      document.getElementById('xem').onclick=()=>{
        document.getElementById('xem').remove();
        document.getElementById('gz').innerHTML=giaiHTML(q,false)+`<div class="row mt"><span class="mut">Em làm đúng không?</span><button class="btn luc nho" id="tok">Đúng ✓</button><button class="btn do nho" id="tsai">Chưa đúng</button></div>`;
        const fin=ok=>{S.bank[q.id]=ok?1:0; if(ok){c++;addStar(3);} save(); i++; show();};
        document.getElementById('tok').onclick=()=>fin(true); document.getElementById('tsai').onclick=()=>fin(false);
        document.getElementById('bn').onclick=()=>fin(false); document.getElementById('bn').parentNode.remove();
      };
      return;
    }
    el.innerHTML=head+`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${String.fromCharCode(65+k)}. ${rich(o)}</button>`).join('')}</div><div id="gz"></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=k===q.a; S.bank[q.id]=ok?1:0; if(ok){c++;addStar(2);} save();
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.k===q.a) x.classList.add('dung');}); if(!ok) b.classList.add('sai');
      document.getElementById('gz').innerHTML=giaiHTML(q,ok); document.getElementById('bn').onclick=()=>{i++;show();};
    });
  }
  show();
}

VIEWS.stats=()=>{
  const byLv=LEVELS.map(l=>{const ws=W.filter(w=>w.lv===l);return [l,ws.length,ws.filter(w=>S.srs[w.id]).length];}).filter(x=>x[1]);
  const byT=TOPICS.map(t=>{const ws=W.filter(w=>w.t===t);return [t,ws.length,ws.filter(w=>S.srs[w.id]).length];});
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  V().innerHTML=`<h2>📈 Tiến độ</h2><div class="grid g4">
   <div class="stat"><div class="n">${learnedCount()}</div><div class="l">Từ đã học</div></div>
   <div class="stat"><div class="n">${knownCount()}</div><div class="l">Từ nhớ chắc</div></div>
   <div class="stat"><div class="n">${Object.values(S.gr).filter(g=>g.done).length}/${GR.length}</div><div class="l">Bài ngữ pháp</div></div>
   <div class="stat"><div class="n">🔥 ${S.streak.n}</div><div class="l">Ngày liên tục</div></div></div>
  <div class="card mt"><h3 style="margin-top:0">Độ chính xác từng phần</h3>${['p1','p2','p3','p4','p5','p6','p7'].map(k=>{const p=S.parts[k]||{c:0,t:0};return `<div class="row" style="margin:8px 0"><b style="width:60px">${k.toUpperCase()}</b><div class="bar" style="flex:1"><i style="width:${pct(p.c,p.t)}%"></i></div><span class="mut" style="width:110px;text-align:right">${p.t?pct(p.c,p.t)+'% ('+p.c+'/'+p.t+')':'chưa luyện'}</span></div>`}).join('')}</div>
  <div class="card"><h3 style="margin-top:0">Từ vựng theo trình độ</h3>${byLv.map(([l,n,d])=>`<div class="row" style="margin:8px 0"><b style="width:60px">${l}</b><div class="bar" style="flex:1"><i style="width:${pct(d,n)}%"></i></div><span class="mut" style="width:110px;text-align:right">${d}/${n}</span></div>`).join('')}</div>
  <div class="card"><h3 style="margin-top:0">Từ vựng theo chủ đề</h3>${byT.map(([t,n,d])=>`<div class="row" style="margin:6px 0"><span style="width:240px;font-size:13.5px">${esc(t)}</span><div class="bar" style="flex:1;min-width:80px"><i style="width:${pct(d,n)}%"></i></div><span class="mut" style="width:80px;text-align:right">${d}/${n}</span></div>`).join('')}</div>
  <div class="card center"><button class="btn do" id="rs" onclick="if(this.dataset.x){localStorage.removeItem(KEY);location.reload()}else{this.dataset.x=1;this.textContent='Bấm lần nữa để xóa hết'}">🗑 Xóa toàn bộ tiến độ</button></div>`;
};
